        <script>
            const svg = document.getElementById("lineas");
            const parametros = [];
            for (let i = 1; i <= 11; i++) {
                parametros.push({
                    freq: 0.001 + Math.random() * 0.002,
                    amp: 25 + Math.random() * 50,
                    phase: Math.random() * 1000
                });
            }

            function conectarTentaculos() {
                svg.innerHTML = "";
                const tiempo = performance.now();
                const centro = document.getElementById("central").getBoundingClientRect();
                const cx = centro.left + centro.width / 2;
                const cy = centro.top + centro.height / 2;

                for (let i = 1; i <= 11; i++) {
                    const nodo = document.getElementById(`r${i}`).getBoundingClientRect();
                    const nx = nodo.left + nodo.width / 2;
                    const ny = nodo.top + nodo.height / 2;

                    const dx = nx - cx;
                    const dy = ny - cy;
                    const distancia = Math.sqrt(dx * dx + dy * dy);
                    const acorte = 40;
                    const tx = nx - (dx / distancia) * acorte;
                    const ty = ny - (dy / distancia) * acorte;

                    const { freq, amp, phase } = parametros[i - 1];
                    const t = tiempo + phase;

                    const mx = (cx + tx) / 2 + Math.sin(t * freq) * amp;
                    const my = (cy + ty) / 2 + Math.cos(t * freq) * amp;

                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("class", "tentaculo");
                    path.setAttribute("d", `M${cx},${cy} Q${mx},${my} ${tx},${ty}`);
                    svg.appendChild(path);
                }

                requestAnimationFrame(conectarTentaculos);
            }

            window.onload = conectarTentaculos;
            window.onresize = () => conectarTentaculos(performance.now());
